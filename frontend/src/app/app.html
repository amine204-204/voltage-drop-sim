<div>
  <div class="loading-overlay" *ngIf="isLoadingCatalog">
    <div class="loading-spinner"></div>
    <p>Loading equipment catalogs...</p>
  </div>

  <app-simulation-top-bar
    [maxSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [isSimulationLoaded]="isSimulationLoaded"
    (runClicked)="onRunClicked($event)"
    (deltaTimeChanged)="onDeltaTimeChanged($event)"
    (maxStepsChanged)="onMaxStepsChanged($event)"
    (currentStepChanged)="onCurrentStepChanged($event)">
  </app-simulation-top-bar>
  
   <app-grid-canvas 
    *ngIf="!isLoadingCatalog"
    [maxSimulationSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [cableCatalogItems]="cableCatalog">
  </app-grid-canvas>
</div>
