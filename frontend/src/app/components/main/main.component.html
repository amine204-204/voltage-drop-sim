<div class="app-shell">
  <app-user-bar
    [projects]="projects"
    [selectedProjectId]="selectedProjectId"
    (projectSelected)="onProjectSelected($event)"
    (newProject)="onNewClicked()"
    (saveProject)="onSaveClicked()"
    (saveAsProject)="onSaveAsClicked()"
    (deleteProject)="onDeleteClicked()">
  </app-user-bar>

  <div class="loading-overlay" *ngIf="isLoadingCatalog">
    <div class="loading-spinner"></div>
    <p>Loading equipment catalogs...</p>
  </div>

  <app-simulation-top-bar
    [maxSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [isSimulationLoaded]="isSimulationLoaded"
    (runClicked)="onRunClicked($event)"
    (deltaTimeChanged)="onDeltaTimeChanged($event)"
    (maxStepsChanged)="onMaxStepsChanged($event)"
    (currentStepChanged)="onCurrentStepChanged($event)">
  </app-simulation-top-bar>
  
   <app-grid-canvas 
    *ngIf="!isLoadingCatalog"
    [maxSimulationSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [cableCatalogItems]="cableCatalog">
  </app-grid-canvas>

  <app-project-modal
    *ngIf="showProjectModal"
    [name]="modalProjectName"
    [description]="modalProjectDescription"
    [isEdit]="isEditModal"
    (onSave)="onModalSave($event)"
    (onClose)="showProjectModal = false">
  </app-project-modal>
</div>
