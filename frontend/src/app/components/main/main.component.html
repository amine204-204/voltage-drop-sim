<div class="app-shell">
  <app-user-bar
    [projects]="projects"
    [selectedProjectId]="selectedProjectId"
    [deleteConfirmStep]="deleteConfirmStep"
    (projectSelected)="onProjectSelected($event)"
    (newProject)="onNewClicked()"
    (saveProject)="onSaveClicked()"
    (saveAsProject)="onSaveAsClicked()"
    (exportProject)="onExportClicked()"
    (importProject)="onImportClicked($event)"
    (deleteProject)="onDeleteClicked()"
    (settingsClicked)="onSettingsClicked()">
  </app-user-bar>

  <div class="loading-overlay" *ngIf="isLoadingCatalog">
    <div class="loading-spinner"></div>
    <p>Loading equipment catalogs...</p>
  </div>

  <app-simulation-top-bar
    [maxSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [isSimulationLoaded]="isSimulationLoaded"
    [isSimulating]="isSimulating"
    [currentStep]="currentStep"
    (runClicked)="onRunClicked($event)"
    (deltaTimeChanged)="onDeltaTimeChanged($event)"
    (maxStepsChanged)="onMaxStepsChanged($event)"
    (currentStepChanged)="onCurrentStepChanged($event)">
  </app-simulation-top-bar>
  
   <div class="canvas-drop-zone"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)">
    <app-grid-canvas 
      *ngIf="!isLoadingCatalog"
      [maxSimulationSteps]="maxSimulationSteps"
      [deltaTime]="deltaTime"
      [minLimitPu]="runMinLimitPu"
      [maxLimitPu]="runMaxLimitPu"
      [cableCatalogItems]="cableCatalog"
      [transformerCatalogItems]="transformerCatalog"
      [switchCatalogItems]="switchCatalog"
      [loadPresets]="loadPresets">
    </app-grid-canvas>
    <div class="drop-overlay" *ngIf="isDragOver">
      <div class="drop-overlay-content">
        <app-icon name="upload" [size]="48"></app-icon>
        <p>Drop JSON file to import graph</p>
      </div>
    </div>
  </div>

  <app-project-modal
    *ngIf="showProjectModal"
    [name]="modalProjectName"
    [description]="modalProjectDescription"
    [isEdit]="isEditModal"
    [errorMessage]="modalError"
    (save)="onModalSave($event)"
    (close)="showProjectModal = false">
  </app-project-modal>

  <app-settings-modal
    *ngIf="showSettingsModal"
    [name]="modalProjectName"
    [description]="modalProjectDescription"
    [selectedNormType]="selectedNormType"
    [customMinPu]="customMinPu"
    [customMaxPu]="customMaxPu"
    [hasProject]="selectedProjectId !== null"
    (settingsChange)="onSettingsApplied($event)"
    (close)="showSettingsModal = false">
  </app-settings-modal>
</div>
