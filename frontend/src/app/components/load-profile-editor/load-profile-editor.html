<div class="modal-overlay" (click)="onClose.emit()">
  <div class="modal-card" (click)="$event.stopPropagation()">
    
    <div class="modal-header">
      <h3>Draw Load Profile</h3>
      <button class="close-btn" (click)="onClose.emit()">✕</button>
    </div>

    <div class="toolbar-row">
      <small>*Click and drag data points vertically to set the load.</small>
    </div>

    <div class="chart-container">
      <canvas #editorCanvas></canvas>
    </div>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="onClose.emit()">Cancel</button>
      <button class="save-btn" (click)="save()">Apply Profile</button>
    </div>

  </div>
</div>
