<div class="section">
  <div class="section-header">
    <h2>Users ({{ users.length }})</h2>
    <div class="header-actions">
      <div class="search-box">
        <app-icon name="search" [size]="14"></app-icon>
        <input [(ngModel)]="searchText" placeholder="Search users..." />
      </div>
      <button class="icon-btn add-btn primary" (click)="showForm = true" title="New User">+</button>
    </div>
  </div>

  <table class="data-table" *ngIf="users.length > 0">
    <thead>
      <tr>
        <th>ID</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let user of filteredUsers">
        <td class="mono">{{ user.id }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>
          <select [ngModel]="user.role" (ngModelChange)="changeRole(user, $event)" class="role-select">
            <option value="ADMIN">ADMIN</option>
            <option value="ENGINEER">ENGINEER</option>
            <option value="VIEWER">VIEWER</option>
          </select>
        </td>
        <td>
          <app-confirm-delete-button *ngIf="user.username !== currentUsername" title="Delete user" (confirm)="deleteUser(user)"></app-confirm-delete-button>
        </td>
      </tr>
    </tbody>
  </table>
  <p class="loading-msg" *ngIf="loading">Loading users...</p>
  <p class="empty-msg" *ngIf="users.length === 0 && !loading">No users found.</p>
</div>

<app-user-form-modal *ngIf="showForm" (save)="createUser($event)" (close)="showForm = false"></app-user-form-modal>
