<app-modal [title]="title" (close)="close.emit()">
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <input [(ngModel)]="model.name" placeholder="e.g. IEEE 1159">
      </div>
      <div class="form-group">
        <label>Description</label>
        <input [(ngModel)]="model.description" placeholder="Optional description">
      </div>
      <div class="form-group">
        <label>Min Voltage (pu)</label>
        <input type="number" [(ngModel)]="model.minVoltagePu" step="0.01" min="0" max="1">
      </div>
      <div class="form-group">
        <label>Max Voltage (pu)</label>
        <input type="number" [(ngModel)]="model.maxVoltagePu" step="0.01" min="1" max="2">
      </div>
      <div class="form-group">
        <label>Active</label>
        <input type="checkbox" [(ngModel)]="model.active">
      </div>
      <div class="form-group">
        <label>Default Standard</label>
        <input type="checkbox" [(ngModel)]="model.defaultStandard">
      </div>
    </div>
  </div>
  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Cancel</button>
    <button class="save-btn" (click)="submit()">{{ submitLabel }}</button>
  </div>
</app-modal>
