<app-modal [title]="title" (close)="close.emit()">
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <input [(ngModel)]="model.name" placeholder="e.g. Residential Load (CC)">
      </div>
      <div class="form-group">
        <label>Load Type</label>
        <select [ngModel]="model.loadType" (ngModelChange)="onLoadTypeChange($event)">
          <option value="CONSTANT_CURRENT">Constant Current</option>
          <option value="CONSTANT_POWER">Constant Power</option>
        </select>
      </div>
      <div class="form-group">
        <label>cos φ</label>
        <input type="number" [(ngModel)]="model.cosPhi" step="0.01" min="0" max="1">
      </div>
      <div class="form-group">
        <label>Unit</label>
        <input [value]="unit" readonly>
      </div>
      <div class="form-group form-group--full">
        <label>Description</label>
        <input [(ngModel)]="model.description" placeholder="Short description of the profile">
      </div>
    </div>

    <div class="curve-preview">
      <div class="curve-preview-info">
        <span>{{ pointCount }} control point{{ pointCount === 1 ? '' : 's' }}</span>
        <span>{{ model.durationSeconds | num }} s</span>
      </div>
      <button class="curve-btn" type="button" (click)="openEditor()">
        <app-icon name="activity" [size]="14"></app-icon>
        Edit Curve
      </button>
    </div>
  </div>

  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Cancel</button>
    <button class="save-btn" (click)="submit()">{{ submitLabel }}</button>
  </div>
</app-modal>

<app-preset-editor-modal
    *ngIf="showEditor"
    [initialData]="{ controlPoints: model.defaultProfile, durationSeconds: model.durationSeconds }"
    [loadUnit]="model.unit"
    (save)="onCurveSaved($event)"
    (close)="showEditor = false">
</app-preset-editor-modal>
