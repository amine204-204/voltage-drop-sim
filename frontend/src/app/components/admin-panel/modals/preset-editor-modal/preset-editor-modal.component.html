<app-modal title="Edit Load Curve" width="850px" (close)="close.emit()">

    <div class="editor-header">
      <div class="duration-control">
        <label>Duration (h)</label>
        <input type="number" [ngModel]="durationHours" (ngModelChange)="onDurationChange($event)" min="0.1" step="0.5" />
      </div>
      <div class="instructions">
        <span>Click to add a point</span>
        <span>Drag a point to reshape the curve</span>
        <span>Right-click a point to delete it</span>
      </div>
    </div>

    <app-profile-curve-canvas
        [initialPoints]="controlPoints"
        [totalDuration]="durationSeconds"
        [maxLoadValue]="maxLoadValue"
        [loadUnit]="loadUnit"
        (pointsChange)="onPointsChange($event)">
    </app-profile-curve-canvas>

    <div class="modal-footer">
      <button class="cancel-btn" (click)="close.emit()">Cancel</button>
      <button class="save-btn" (click)="submit()">Save Curve</button>
    </div>

</app-modal>
