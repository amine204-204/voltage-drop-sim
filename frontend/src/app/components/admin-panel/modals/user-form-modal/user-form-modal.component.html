<app-modal title="New User" (close)="close.emit()">
  <div class="modal-body">
    <div class="form-grid">
      <div class="form-group">
        <label>Username</label>
        <input [(ngModel)]="username" placeholder="Username">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input [(ngModel)]="email" type="email" placeholder="Email">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input [(ngModel)]="password" type="password" placeholder="Password">
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <input [(ngModel)]="confirmPassword" type="password" placeholder="Confirm Password">
      </div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="role">
          <option value="ENGINEER">Engineer</option>
          <option value="VIEWER">Viewer</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>
    <div class="form-error" *ngIf="errorMessage">{{ errorMessage }}</div>
  </div>
  <div class="modal-footer">
    <button class="cancel-btn" (click)="close.emit()">Cancel</button>
    <button class="save-btn" (click)="submit()">Create</button>
  </div>
</app-modal>
