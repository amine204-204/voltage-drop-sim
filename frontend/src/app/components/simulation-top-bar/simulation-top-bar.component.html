<div class="top-bar">
  <div class="settings-group">
    <label>Steps:</label>
    <input type="number" [ngModel]="maxSteps" (ngModelChange)="maxStepsChanged.emit($event)" min="1">
  </div>

  <div class="settings-group">
    <label>Δt (sec):</label>
    <input type="number" [ngModel]="deltaTime" (ngModelChange)="deltaTimeChanged.emit($event)" step="0.01" min="0.01">
  </div>

  <div class="playback-group" *ngIf="isSimulationLoaded">
    <label>Step:</label>
    <input type="range" [min]="0" [max]="maxSteps - 1" [value]="currentStep" (input)="onSliderChange($event)"
      class="slider">
    <span class="step-display">{{ currentStep }} / {{ maxSteps - 1 }}</span>
  </div>

  <button class="run-btn" (click)="onRun()" [disabled]="isSimulating">
    {{ isSimulating ? 'RUNNING...' : '▶ RUN' }}
  </button>


</div>
