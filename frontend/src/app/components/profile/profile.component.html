<div class="profile-page">
  <app-page-header [title]="targetUserId ? 'Edit User Profile' : 'My Profile'"></app-page-header>

  <div class="profile-content" *ngIf="!loading && profile">

    <div class="profile-role-badge">
      <span class="role-tag" [attr.data-role]="profile.role">{{ profile.role }}</span>
    </div>

    <div class="section">
      <h2>Account</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Username</label>
          <input [(ngModel)]="profileForm.username" placeholder="Username">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input [(ngModel)]="profileForm.email" type="email" placeholder="Email">
        </div>
      </div>
      <div class="form-message success" *ngIf="profileSuccess">{{ profileSuccess }}</div>
      <div class="form-message error" *ngIf="profileError">{{ profileError }}</div>
      <div class="form-actions">
        <button class="action-btn primary" (click)="saveProfile()">Save Changes</button>
      </div>
    </div>

    <div class="section">
      <h2>Change Password</h2>
      <div class="form-grid">
        <div class="form-group">
          <label>Current Password</label>
          <input [(ngModel)]="passwordForm.currentPassword" type="password" placeholder="Current password">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input [(ngModel)]="passwordForm.newPassword" type="password" placeholder="New password">
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <input [(ngModel)]="confirmPassword" type="password" placeholder="Confirm new password">
        </div>
      </div>
      <div class="form-message success" *ngIf="passwordSuccess">{{ passwordSuccess }}</div>
      <div class="form-message error" *ngIf="passwordError">{{ passwordError }}</div>
      <div class="form-actions">
        <button class="action-btn primary" (click)="changePassword()">Change Password</button>
      </div>
    </div>

  </div>

  <div class="loading-msg" *ngIf="loading">Loading profile...</div>
</div>
