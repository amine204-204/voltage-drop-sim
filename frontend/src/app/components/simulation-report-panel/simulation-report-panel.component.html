<div class="report-panel">

  <div class="report-header">
    <span class="report-title">Power Quality Report</span>
    <button class="report-close" (click)="close.emit()" title="Close report">
      <app-icon name="close" [size]="14"></app-icon>
    </button>
  </div>

  <div class="report-stale" *ngIf="stale">
    Results from last run
  </div>

  <div class="report-empty" *ngIf="issues.length === 0">
    No violations
  </div>

  <div class="report-list" *ngIf="issues.length > 0">
    <button class="report-item" *ngFor="let issue of issues" (click)="issueClicked.emit(issue)">
      <span class="sev-dot" [class.sev-severe]="isSevere(issue.classification)"></span>
      <span class="report-main">
        <span class="report-label">{{ labelFor(issue.classification) }}</span>
        <span class="report-path">{{ issue.nodeName }}</span>
        <span class="report-path">{{ pathLabel(issue) }}</span>
      </span>
      <span class="report-meta">
        <span class="report-mag mono">−{{ magnitudePercent(issue) }}%</span>
        <span class="report-time mono">{{ timeRangeSeconds(issue) }}</span>
      </span>
    </button>
  </div>

</div>
