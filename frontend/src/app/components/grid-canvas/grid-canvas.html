<div class="workspace">
  
  <div class="toolbar">
    <button 
      (click)="selectTool('pointer')" 
      [class.active-tool]="currentTool === 'pointer'"
      title="Select / Move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
      </svg>
    </button>
    
    <hr class="toolbar-divider">

    <button 
      (click)="selectTool('place-SOURCE')" 
      [class.active-tool]="currentTool === 'place-SOURCE'"
      title="Substation (Source)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
      </svg>
    </button>
    
    <button 
      (click)="selectTool('place-JUNCTION')" 
      [class.active-tool]="currentTool === 'place-JUNCTION'"
      title="Busbar (Junction)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M12 2v7M12 15v7M2 12h7M15 12h7"/>
      </svg>
    </button>
    
    <button 
      (click)="selectTool('place-CONSUMER')" 
      [class.active-tool]="currentTool === 'place-CONSUMER'"
      title="Load (Consumer)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 20V10"/>
        <path d="M12 20V4"/>
        <path d="M6 20v-6"/>
      </svg>
    </button>
    
    <hr class="toolbar-divider">

    <button 
      (click)="selectTool('draw-cable')" 
      [class.active-tool]="currentTool === 'draw-cable'"
      title="Draw Cable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="18" r="3"/>
        <circle cx="18" cy="6" r="3"/>
        <path d="M6 15V6a3 3 0 013-3h6"/>
      </svg>
    </button>

  </div>

  <div class="canvas-container">
    <div #cyContainer class="cy-container"></div>
  </div>

  <app-property-panel 
    *ngIf="selectedElementData"
    [elementData]="selectedElementData" 
    [elementType]="selectedElementType"
    [simulationStep]="currentSimulationStep"
    [maxSimulationSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [cableCatalogItems]="cableCatalogItems"
    [loadPresets]="loadPresets"
    (propertyChanged)="onPropertyUpdated($event)"
    (openChart)="showChartModal = true"
    (openProfileEditor)="showProfileEditor = true">
  </app-property-panel>

  <app-voltage-chart-modal 
    *ngIf="showChartModal && selectedElementData"
    [nodeName]="selectedElementData.label"
    [voltageTimeSeries]="selectedElementData.simulationData?.potentialTimeSeries"
    [nominalVoltage]="chartNominalVoltage"
    [deltaTime]="deltaTime"
    (onClose)="showChartModal = false">
  </app-voltage-chart-modal>

   <app-load-profile-editor 
    *ngIf="showProfileEditor && selectedElementData"
    [initialProfile]="selectedElementData.loadProfile || []"
    [initialControlPoints]="selectedElementData.loadProfileControlPoints || null"
    [totalSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime"
    [maxLoadValue]="100" 
    [loadUnit]="selectedElementData.loadType === 'CONSTANT_POWER' ? 'W' : 'A'"
    (onSave)="onProfileSaved($event)"
    (onClose)="showProfileEditor = false">
  </app-load-profile-editor>

</div>
