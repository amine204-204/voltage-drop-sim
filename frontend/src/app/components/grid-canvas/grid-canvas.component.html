<div class="workspace">

  <div class="toolbar">
    <button (click)="selectTool('pointer')" [class.active-tool]="currentTool === 'pointer'" title="Select / Move">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z" />
      </svg>
    </button>

    <hr class="toolbar-divider">

    <button (click)="selectTool('place-SOURCE')" [class.active-tool]="currentTool === 'place-SOURCE'"
      title="Substation (Source)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
      </svg>
    </button>

    <button (click)="selectTool('place-JUNCTION')" [class.active-tool]="currentTool === 'place-JUNCTION'"
      title="Busbar (Junction)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" />
        <path d="M12 2v7M12 15v7M2 12h7M15 12h7" />
      </svg>
    </button>

    <button (click)="selectTool('place-CONSUMER')" [class.active-tool]="currentTool === 'place-CONSUMER'"
      title="Load (Consumer)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M18 20V10" />
        <path d="M12 20V4" />
        <path d="M6 20v-6" />
      </svg>
    </button>

    <hr class="toolbar-divider">

    <button (click)="selectTool('draw-cable')" [class.active-tool]="currentTool === 'draw-cable'" title="Draw Cable">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
        stroke-linejoin="round">
        <circle cx="6" cy="18" r="3" />
        <circle cx="18" cy="6" r="3" />
        <path d="M6 15V6a3 3 0 013-3h6" />
      </svg>
    </button>

  </div>

  <div class="canvas-area">
    <div class="canvas-container">
      <div #cyContainer class="cy-container"></div>

      <div class="empty-state" *ngIf="isEmpty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
          stroke-linejoin="round" width="48" height="48">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
          <line x1="3" y1="9" x2="21" y2="9" />
          <line x1="9" y1="21" x2="9" y2="9" />
        </svg>
        <p class="empty-hint">Start building your grid</p>

      </div>

      <div class="zoom-controls">
        <button (click)="zoomIn()" title="Zoom in">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="11" y1="8" x2="11" y2="14" />
            <line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        </button>
        <button (click)="zoomOut()" title="Zoom out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" />
            <line x1="8" y1="11" x2="14" y2="11" />
          </svg>
        </button>
        <button (click)="fitToScreen()" title="Fit to screen">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round" width="16" height="16">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
          </svg>
        </button>
      </div>
    </div>

    <div class="status-bar">
      <span class="status-item">
        <span class="status-dot" [class.active]="currentTool !== 'pointer'"></span>
        {{ currentToolLabel }}
      </span>
      <span class="status-divider"></span>
      <span class="status-item">{{ nodeCount }} nodes</span>
      <span class="status-divider"></span>
      <span class="status-item">{{ edgeCount }} cables</span>
      <span class="status-spacer"></span>
      <span class="status-item status-hint" *ngIf="isSpacePressed">Panning — release Space to stop</span>
      <span class="status-item mono">{{ zoomPercent }}%</span>
    </div>
  </div>

  <app-property-panel *ngIf="selectedElementData" [elementData]="selectedElementData"
    [elementType]="selectedElementType" [simulationStep]="currentSimulationStep"
    [maxSimulationSteps]="maxSimulationSteps" [deltaTime]="deltaTime" [cableCatalogItems]="cableCatalogItems"
    [loadPresets]="loadPresets" (propertyChanged)="onPropertyUpdated($event)" (openChart)="showChartModal = true"
    (openProfileEditor)="showProfileEditor = true">
  </app-property-panel>

  <app-voltage-chart-modal *ngIf="showChartModal && selectedElementData" [nodeName]="selectedElementData.label"
    [voltageTimeSeries]="selectedElementData.simulationData?.potentialTimeSeries" [nominalVoltage]="chartNominalVoltage"
    [deltaTime]="deltaTime" (close)="showChartModal = false">
  </app-voltage-chart-modal>

  <app-load-profile-editor *ngIf="showProfileEditor && selectedElementData"
    [initialProfile]="selectedElementData.loadProfile || []"
    [initialControlPoints]="selectedElementData.loadProfileControlPoints || null" [totalSteps]="maxSimulationSteps"
    [deltaTime]="deltaTime" [maxLoadValue]="100"
    [loadUnit]="selectedElementData.loadType === 'CONSTANT_POWER' ? 'W' : 'A'" (save)="onProfileSaved($event)"
    (close)="showProfileEditor = false">
  </app-load-profile-editor>

</div>
