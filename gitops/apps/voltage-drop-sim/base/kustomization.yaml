apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = environment-agnostic desired state. No image tags or env-specific
# tweaks here; overlays provide those. Note secret.example.yaml is intentionally
# NOT listed: applying it would create a placeholder Secret and clobber the real one.
resources:
  - namespace.yaml
  - config.yaml
  - mongo-seed-configmap.yaml
  - postgres.yaml
  - mongodb.yaml
  - rabbitmq.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
