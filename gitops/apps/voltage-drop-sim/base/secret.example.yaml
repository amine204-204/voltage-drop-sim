# TEMPORARY plain secret for the manual phase.
# Will be replaced by a SealedSecret once ArgoCD is introduced.
apiVersion: v1
kind: Secret
metadata:
  name: vds-db-secret
  namespace: vds
type: Opaque
stringData:
  DB_USERNAME: example
  DB_PASSWORD: "example"
  DB_NAME: example
  # Dev-only: must be >= 32 bytes for HS256. Move to Sealed Secrets in the GitOps phase.
  JWT_SECRET: "example"
