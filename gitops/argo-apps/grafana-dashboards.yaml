apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana-dashboards
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Plain manifests (a Kustomize configMapGenerator) from THIS repo, not a chart.
    repoURL: https://github.com/amine204-204/voltage-drop-sim.git
    targetRevision: main
    path: gitops/platform/monitoring/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
