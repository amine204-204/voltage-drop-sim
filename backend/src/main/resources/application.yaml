spring:
  application:
    name: voltage-drop-sim
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/grid_catalogs}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: 86400000 # 24 hours
  refresh-expiration-ms: 604800000 # 7 days

simulation:
  grid:
    nominal-frequency-hz: 50
  math:
    default-power-factor: 0.95
  convergence:
    voltage-tolerance-pu: 0.0001
    max-iterations: 50
  norms:
    active-norm: en50160
    en50160:
      min-voltage-pu: 0.9
      max-voltage-pu: 1.1
  ieee1159:
    instantaneous-sag-max-seconds: 0.5
    momentary-sag-max-seconds: 3
    temporary-sag-max-seconds: 60

