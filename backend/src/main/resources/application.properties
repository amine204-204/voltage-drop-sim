spring.application.name=voltage-drop-sim

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect


simulation.grid.nominal-frequency-hz=50.0
simulation.math.default-power-factor=0.95
simulation.convergence.voltage-tolerance-pu=0.0001
simulation.convergence.max-iterations=50
simulation.norms.active-norm=en50160
simulation.norms.en50160.min-voltage-pu=0.90
simulation.norms.en50160.max-voltage-pu=1.10
simulation.ieee1159.instantaneous-sag-max-seconds=0.5
simulation.ieee1159.momentary-sag-max-seconds=3.0
simulation.ieee1159.temporary-sag-max-seconds=60.0

simulation.catalog.file=classpath:cables.json
