kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: vds

nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP only: host port 443 is held by vmware-hostd.
      - containerPort: 80
        hostPort: 80
        protocol: TCP
