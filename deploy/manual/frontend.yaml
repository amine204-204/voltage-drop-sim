apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vds
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: vds-frontend:dev-v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/
      volumes:
        - name: proxy-config
          configMap:
            name: app-config
            items:
              - key: default.conf
                path: default.conf
            
    
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vds
  labels:
    app: frontend
spec:
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
