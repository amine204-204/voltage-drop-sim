apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vds
  namespace: vds
  labels:
    app.kubernetes.io/part-of: voltage-drop-sim
spec:
  ingressClassName: nginx
  rules:
    # Add "127.0.0.1 vds.localhost" to your hosts file, or use host: localhost
    - host: vds.localhost
      http:
        paths:
          # Frontend nginx already proxies /api/ -> backend:8080,
          # so a single catch-all rule is enough.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
          # Alternative (skip the extra nginx hop once the frontend proxy is removed):
          # - path: /api
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: backend
          #       port:
          #         number: 8080
