name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/security-static.yml'
      - '.zap/**'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/workflows/security-static.yml'
      - '.zap/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  security-events: write   # required by the Trivy SARIF upload in security-static.yml

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vds-backend

jobs:
  # Shift-left gate: static scans must pass before any image is built or pushed.
  security-static:
    uses: ./.github/workflows/security-static.yml
    secrets: inherit

  build:
    needs: security-static
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.short.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Short SHA (matches metadata-action type=sha,format=short)
        id: short
        run: echo "sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Excludes the @SpringBootTest which needs Postgres/Mongo (unavailable on the runner).
      # The remaining tests are plain JUnit unit tests and need no infrastructure.
      - name: Unit tests
        working-directory: backend
        run: ./mvnw -B test -Dtest='!VoltageDropSimApplicationTests'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Creates a buildx builder backed by the docker-container driver.
      # The default `docker` driver cannot export cache, which `cache-to: type=gha` requires.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (do not publish yet)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image gate (Critical + High)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:sha-${{ steps.short.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          scanners: vuln,secret
          exit-code: '1'

      - name: Publish to GHCR
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker push "$tag"
          done <<< "$TAGS"

  # ---------------------------------------------------------------------------
  # Dynamic analysis (DAST) of the exact candidate image before it is pinned.
  # ZAP runs with --network host, so localhost:8080 reaches the app container.
  # ---------------------------------------------------------------------------
  dast-backend:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    concurrency:
      group: dast-backend-${{ github.ref }}
      cancel-in-progress: true

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vds
          POSTGRES_USER: vds
          POSTGRES_PASSWORD: vds
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vds -d vds"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout (for the ZAP rules file)
        uses: actions/checkout@v4

      - name: Pull candidate image from GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.short_sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull "$IMAGE_TAG"

      - name: Generate throwaway JWT key for the scan
        # Generated at runtime: never store a credential-looking literal in the repo.
        run: echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')" >> "$GITHUB_ENV"

      - name: Start app from the candidate image
        env:
          IMAGE_TAG: ${{ env.IMAGE }}:sha-${{ needs.build.outputs.short_sha }}
        run: |
          docker run -d --name vds --network host \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/vds \
            -e DB_USERNAME=vds \
            -e DB_PASSWORD=vds \
            -e SPRING_DATA_MONGODB_URI=mongodb://localhost:27017/grid_catalogs \
            -e JWT_SECRET="$JWT_SECRET" \
            "$IMAGE_TAG"
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/actuator/health/readiness > /dev/null; then
              echo "backend is ready"
              exit 0
            fi
            sleep 3
          done
          echo "::error::backend did not become ready"
          docker logs vds
          exit 1

      - name: Create scan-only admin and JWT
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/seed-admin \
            -H 'Content-Type: application/json' \
            -d '{"username":"zap-scan","password":"ScanOnly-2026!"}' | jq -r .token)
          echo "ZAP_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: ZAP baseline (passive)
        uses: zaproxy/action-baseline@v0.15.0
        env:
          ZAP_AUTH_HEADER: Authorization
          ZAP_AUTH_HEADER_VALUE: Bearer ${{ env.ZAP_TOKEN }}
          ZAP_AUTH_HEADER_SITE: localhost:8080
        with:
          target: http://localhost:8080
          docker_name: ghcr.io/zaproxy/zaproxy:stable
          rules_file_name: .zap/rules.tsv
          fail_action: false
          allow_issue_writing: false

      # /v3/api-docs itself is authenticated, so fetch the spec with the scan JWT.
      - name: Fetch OpenAPI spec
        run: |
          curl -fsS -H "Authorization: Bearer $ZAP_TOKEN" \
            http://localhost:8080/v3/api-docs -o openapi.json
          jq -e '.openapi' openapi.json > /dev/null

      - name: ZAP API scan (active, from OpenAPI spec)
        run: |
          chmod a+w "$GITHUB_WORKSPACE"
          docker run --rm --network host -v "$GITHUB_WORKSPACE:/zap/wrk/:rw" \
            -e ZAP_AUTH_HEADER=Authorization \
            -e ZAP_AUTH_HEADER_VALUE="Bearer $ZAP_TOKEN" \
            -e ZAP_AUTH_HEADER_SITE=localhost:8080 \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t openapi.json -O http://localhost:8080 -f openapi \
              -c .zap/rules.tsv -J zap-api.json -I -T 5
          test -s zap-api.json || { echo "::error::ZAP produced no report"; exit 1; }

      - name: Quality gate — Medium and High alerts block
        run: |
          for report in report_json.json zap-api.json; do
            count=$(jq '[.. | objects | select(has("riskcode")) | .riskcode | tonumber? // 0]
                        | map(select(. >= 2)) | length' "$report")
            echo "$report: $count Medium+ alert(s)"
            [ "$count" -eq 0 ] || exit 1
          done

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_html.html
            zap-api.json
            openapi.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Continuous delivery write-back.
  #
  # After the image is pushed to GHCR, pin the freshly built tag in the Git
  # overlay so ArgoCD reconciles it. Git stays the single source of truth; this
  # job is the only thing that edits the overlay, and only this image's line.
  #
  # No infinite loop: commits pushed with the default GITHUB_TOKEN do not
  # trigger workflows, and this commit only touches gitops/** which is not in
  # any workflow's `paths` trigger besides the app images they build.
  # ---------------------------------------------------------------------------
  update-tag:
    needs: [build, dast-backend]
    # Real pushes to main only (PRs never push an image; manual runs are excluded).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level set for this job only,
    # so we drop packages:write and gain the contents:write needed to push.
    permissions:
      contents: write
    # Same group name as the frontend workflow => the two write-backs serialize
    # instead of racing on the shared overlay file. Queue, do not cancel.
    concurrency:
      group: gitops-writeback
      cancel-in-progress: false
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Bump backend tag in the kind overlay
        run: |
          # Matches metadata-action's `type=sha,format=short` output (7 chars).
          TAG="sha-${GITHUB_SHA:0:7}"
          python3 gitops/scripts/bump-image-tag.py \
            gitops/apps/voltage-drop-sim/overlays/kind/kustomization.yaml \
            "${IMAGE}" "$TAG"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/voltage-drop-sim/overlays/kind/kustomization.yaml
          # Re-runs and idempotent pushes produce no diff -> succeed, no empty commit.
          if git diff --cached --quiet; then
            echo "Image tag already up to date; nothing to commit."
            exit 0
          fi
          git commit -m "cd(backend): pin image to ${GITHUB_SHA:0:7}"
          # Retry on a rebase in case another commit (e.g. the frontend
          # write-back) landed between our checkout and this push.
          for attempt in 1 2 3; do
            git pull --rebase --autostash
            git push && exit 0
            echo "push rejected, retrying ($attempt/3)"; sleep 5
          done
          echo "::error::failed to push the backend tag bump after 3 attempts"; exit 1
