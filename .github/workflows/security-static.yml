name: security-static

# Reusable shift-left gate. Called by both backend-ci.yml and frontend-ci.yml
# before any image is built or published.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Secrets in code AND in the full git history.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Keep least privilege: no PR comments from fork runs.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  # SCA for both ecosystems. --severity-threshold=high fails on High + Critical.
  sca:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Install Snyk CLI
        run: npm install -g snyk

      - name: Snyk — Java dependencies
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=backend/pom.xml --severity-threshold=high

      - name: Snyk — Node dependencies
        if: env.SNYK_TOKEN != ''
        run: snyk test --file=frontend/package-lock.json --package-manager=npm --severity-threshold=high

      # Fork PRs do not receive secrets. Say so explicitly instead of silently passing.
      - name: Snyk skipped (fork PR)
        if: env.SNYK_TOKEN == ''
        run: echo "::warning::Snyk skipped - secrets are unavailable on fork pull requests"

  # Filesystem: CVEs, secrets, and IaC/Dockerfile misconfigurations.
  trivy-fs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
          limit-severities-for-sarif: true
          format: sarif
          output: trivy-fs.sarif

      - name: Upload SARIF to Security tab
        if: |
          always() && (
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          )
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
